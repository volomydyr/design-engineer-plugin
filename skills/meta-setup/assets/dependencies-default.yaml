      - problem-statement
      - target-audience
      - assumptions
      - competitor-analysis
      - storybrand
    informs:
      - mvp-requirements
    folder: foundation
    phase: 2
    skill: ux-business-plan

  # documentation-only – no canonical file, reminder hook never fires for this entry
  story-panels:
    depends_on:
      - target-audience
      - storybrand
    informs:
      - customer-journey-map
      - bias-audit
      - mvp-requirements
    folder: exploration
    phase: 2
    skill: ux-story-panels

  behavior-map:
