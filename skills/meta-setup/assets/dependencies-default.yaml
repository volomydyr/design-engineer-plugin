# Design-Engineer Dependency Graph (static reference)
# ─────────────────────────────────
# Maps deliverables produced by the plugin and their relationships.
# This file is READ-ONLY documentation – the plugin does not mutate it at runtime.
# When you update a deliverable, review its `informs:` entries and decide
# whether those downstream deliverables need refreshing.
#
# Live progress (current phase, recent deliverables, key decisions, stale dependents)
# is tracked separately in the compound-documenter agent's memory at
# .claude/agent-memory/design-engineer-compound-documenter/ – auto-updated by /design-engineer:document.
#
# Each deliverable entry carries:
#   - depends_on: deliverables that must exist or inform this one
#   - informs:    deliverables that should be reviewed when this one changes
#   - folder:     bare subdir name (foundation, research, planning, exploration,
#                 psychology, reviews, dev, features, feedback). The full canonical path is
#                 .design-engineer-plugin/design/<folder>/. Write each deliverable
#                 to its canonical path with its canonical filename.
#   - phase:      pipeline phase where this deliverable is primarily created
#   - skill:      the skill that produces this deliverable
#
# Entry keys match the canonical FILENAME (without .md) that the producing
# skill writes, so the check_deliverable_deps.py reminder hook can match an
# edited file back to its entry. Entries marked "documentation-only" describe
# work that produces no canonical file – they exist to keep the phase map and
# depends_on chains complete, and the reminder hook never fires for them.

deliverables:

  # ═══════════════════════════════════════════
  # PHASE 1: DISCOVERY & FOUNDATION
  # ═══════════════════════════════════════════

  problem-statement:
    depends_on: []
    informs:
      - target-audience
      - assumptions
      - competitor-analysis
      - storybrand
      - business-plan
      - mvp-requirements
    folder: foundation
    phase: 1
    skill: ux-problem-statement

  target-audience:
    depends_on:
      - problem-statement
    informs:
      - assumptions
      - competitor-analysis
      - research-findings
      - storybrand
      - business-plan
      - mvp-requirements
      - customer-journey-map
      - bias-audit
    folder: foundation
    phase: 1
    skill: ux-target-audience

  assumptions:
    depends_on:
      - problem-statement
      - target-audience
    informs:
      - competitor-analysis
      - research-findings
      - business-plan
      - mvp-requirements
    folder: foundation
    phase: 1
    skill: ux-assumptions

  competitor-analysis:
    depends_on:
      - problem-statement
      - target-audience
      - assumptions
    informs:
      - storybrand
      - business-plan
      - mvp-requirements
      - references
    folder: research
    phase: 1
    skill: ux-competitor-analysis

  research-findings:
    depends_on:
      - target-audience
      - assumptions
    informs:
      - storybrand
      - business-plan
      - mvp-requirements
      - customer-journey-map
      - bias-audit
    folder: research
    phase: 1
    skill: ux-user-interviews

  # ═══════════════════════════════════════════
  # PHASE 2: STRATEGY & POSITIONING
  # ═══════════════════════════════════════════

  storybrand:
    depends_on:
      - problem-statement
      - target-audience
      - competitor-analysis
    informs:
      - business-plan
      - mvp-requirements
      - customer-journey-map
    folder: foundation
    phase: 2
    skill: ux-storybrand

  business-plan:
