# Documentation entry frontmatter template
# Every documentation entry written by the meta-document skill opens with this
# YAML frontmatter. Four required fields, two optional ones.

required_fields:
  activity:
    type: string
    description: "Name of the activity or skill that was performed"
    examples:
      - "problem-statement"
      - "target-audience"
      - "bias-audit"
      - "frontend-implementation"
      - "design-system-setup"

  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "Date when this activity was completed (YYYY-MM-DD)"

  category:
    type: enum
    values:
      - foundation
      - research
      - planning
      - exploration
      - psychology
      - reviews
      - dev
      - features
      - prototype
      - plans
    description: "Deliverable area this entry belongs to – determines the directory (see the category table below)"

  status:
    type: enum
    values:
      - draft                   # Initial version, needs review
      - in-progress             # Currently being worked on
      - complete                # Finished and approved
      - revised                 # Updated after initial completion
      - superseded              # Replaced by a newer version
    description: "Current state of the entry"

optional_fields:
  tags:
    type: array[string]
    max_items: 8
    description: "Searchable keywords (lowercase, hyphen-separated)"
    examples:
      - "persona"
      - "mvp-scope"
      - "design-tokens"
      - "accessibility"
      - "psychology"

  failed_approaches:
    type: array[string]
    description: "Approaches that were tried and did not work, with the reason each failed"
    examples:
      - "Attempted to generate IA before completing user research – too speculative"
      - "Used generic persona template – lacked product-specific motivation data"

# Category table: category -> directory
# All deliverable directories live under .design-engineer-plugin/ so the project root stays clean.
category_table:
  foundation: ".design-engineer-plugin/design/foundation/"
  research: ".design-engineer-plugin/design/research/"
  planning: ".design-engineer-plugin/design/planning/"
  exploration: ".design-engineer-plugin/design/exploration/"
  psychology: ".design-engineer-plugin/design/psychology/"
  reviews: ".design-engineer-plugin/design/reviews/"
  dev: ".design-engineer-plugin/design/dev/"
  features: ".design-engineer-plugin/design/features/"
  prototype: ".design-engineer-plugin/prototype/"
  plans: ".design-engineer-plugin/plans/"

# Example frontmatter:
# ---
# activity: problem-statement
# date: 2026-01-15
# category: foundation
# status: complete
# tags: [problem-definition, user-needs]
# failed_approaches:
#   - "Initially tried to define problems without target audience research – too abstract, revised after completing personas"
# ---
