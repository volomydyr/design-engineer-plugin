  # Psychology (psych-* audits)
  psych_full_scan: ".design-engineer-plugin/design/psychology/"
  psych_pricing: ".design-engineer-plugin/design/psychology/"
  psych_visual_perception: ".design-engineer-plugin/design/psychology/"
  psych_time_perception: ".design-engineer-plugin/design/psychology/"
  psych_emotional_retention: ".design-engineer-plugin/design/psychology/"
  psych_social_influence: ".design-engineer-plugin/design/psychology/"
  psych_cognitive_load: ".design-engineer-plugin/design/psychology/"
  psych_cognitive_biases: ".design-engineer-plugin/design/psychology/"
  psych_decision_fundamentals: ".design-engineer-plugin/design/psychology/"
  psych_decision_persuasion: ".design-engineer-plugin/design/psychology/"
  psych_delight_design: ".design-engineer-plugin/design/psychology/"
  psych_engagement_patterns: ".design-engineer-plugin/design/psychology/"
  psych_habit_formation: ".design-engineer-plugin/design/psychology/"
