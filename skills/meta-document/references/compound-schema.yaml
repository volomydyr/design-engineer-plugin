  problem_statement: ".design-engineer-plugin/design/foundation/"
  target_audience: ".design-engineer-plugin/design/foundation/"
  assumptions_doc: ".design-engineer-plugin/design/foundation/"
  storybrand_canvas: ".design-engineer-plugin/design/foundation/"
  business_plan: ".design-engineer-plugin/design/foundation/"

  # Research (external evidence gathering)
  competitor_analysis: ".design-engineer-plugin/design/research/"
  interview_findings: ".design-engineer-plugin/design/research/"
  research_synthesis: ".design-engineer-plugin/design/research/"

  # Planning (Phase 2: scope decisions)
  mvp_requirements: ".design-engineer-plugin/design/planning/"
  information_architecture: ".design-engineer-plugin/design/planning/"

  # Exploration (Phase 3: design exploration)
  bias_audit: ".design-engineer-plugin/design/exploration/"
  behavior_map: ".design-engineer-plugin/design/exploration/"
  journey_map: ".design-engineer-plugin/design/exploration/"
  ethics_review: ".design-engineer-plugin/design/exploration/"
  story_panels: ".design-engineer-plugin/design/exploration/story-panels/"
