  full_review: ".design-engineer-plugin/design/reviews/"
  audit: ".design-engineer-plugin/design/reviews/"
  accessibility_audit: ".design-engineer-plugin/design/reviews/"
  product_assessment: ".design-engineer-plugin/design/reviews/"
  visual_review: ".design-engineer-plugin/design/reviews/"

  # Dev (development preparation deliverables)
  claude_md_draft: ".design-engineer-plugin/design/dev/"
  agent_setup: ".design-engineer-plugin/design/dev/"
  mcp_setup: ".design-engineer-plugin/design/dev/"
  github_workflow: ".design-engineer-plugin/design/dev/"
  starter_prompts: ".design-engineer-plugin/design/dev/"
  design_system: ".design-engineer-plugin/design/dev/"
  status_tracking: ".design-engineer-plugin/design/dev/"

  # Features (per-feature specs)
